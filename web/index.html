<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAICompute</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d12;color:#f5f7fb}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#f5f7fb;color:#0b0d12;font-weight:700}button.secondary{background:#1a1e28;color:#dfe5ef;border:1px solid #2b3240}button.danger{background:#d84b5b;color:#fff}.app{display:grid;grid-template-columns:280px 1fr;height:100vh}.side{border-right:1px solid #202532;padding:22px;background:#10131a;display:flex;flex-direction:column;gap:18px}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;color:#8e98aa}.model-list{display:flex;flex-direction:column;gap:8px;overflow:auto}.model{padding:12px;border:1px solid #242b38;border-radius:12px;background:#141821}.model.active{border-color:#7c8cff}.model-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.model-size{font-size:11px;color:#7f899b;margin-top:4px}.model-actions{display:flex;gap:6px;margin-top:10px}.model-actions button{padding:6px 8px;font-size:11px}.main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #202532}.stats{display:flex;gap:18px;color:#9da7b8;font-size:13px}.stats b{color:#f5f7fb}.chat{padding:24px;overflow:auto;max-width:1000px;width:100%;margin:auto}.msg{padding:14px 16px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.55}.user{background:#171c27;margin-left:15%}.assistant{background:#11151d;border:1px solid #242b38;margin-right:10%}.empty{text-align:center;color:#697386;margin-top:18vh}.composer{padding:18px 24px;border-top:1px solid #202532}.compose{max-width:1000px;margin:auto;display:flex;gap:10px}.compose textarea{flex:1;resize:none;min-height:54px;max-height:180px;background:#141821;color:#fff;border:1px solid #2a3140;border-radius:14px;padding:14px;outline:none}.upload{display:flex;gap:8px;align-items:center}.upload input{display:none}.hint{font-size:11px;color:#697386}.busy{color:#9da7b8}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6f7cff;margin-right:6px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.user,.assistant{margin-left:0;margin-right:0}.top{padding:14px}.stats{gap:8px;font-size:11px}.chat,.composer{padding:14px}}</style></head><body><div class="app"><aside class="side"><div><div class="brand">LAICompute</div><div class="sub">Local CPU inference</div></div><div class="upload"><label for="file"><button class="secondary" type="button">＋ Upload GGUF</button></label><input id="file" type="file" accept=".gguf"></div><div class="hint">Models are stored on the server.</div><div class="model-list" id="models"></div></aside><main class="main"><header class="top"><div><b id="loaded">No model loaded</b><div class="sub" id="state">Ready</div></div><div class="stats"><span>CPU <b id="cpu">—</b></span><span>RAM <b id="ram">—</b></span><span>tok/s <b id="tps">—</b></span></div></header><section class="chat" id="chat"><div class="empty" id="empty">Load a GGUF model, then start chatting.</div></section><footer class="composer"><div class="compose"><textarea id="input" placeholder="Send a message…" rows="1"></textarea><button id="stop" class="danger" hidden>Stop</button><button id="send">Send</button></div></footer></main></div><script>const $=id=>document.getElementById(id);let busy=false;function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function size(n){let u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}async function api(path,opt={}){let r=await fetch(path,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function refresh(){try{let m=await api('/api/models');$('models').innerHTML=m.length?m.map(x=>`<div class="model ${x.loaded?'active':''}"><div class="model-name">${esc(x.name)}</div><div class="model-size">${size(x.size)} ${x.loaded?'· loaded':''}</div><div class="model-actions"><button onclick="loadModel(${JSON.stringify(x.name)})">Use</button><button class="secondary" onclick="unloadModel()">Unload</button></div></div>`).join(''):'<div class="hint">No GGUF models yet.</div>';}catch(e){console.error(e)}}async function loadModel(name){try{$('state').textContent='Loading…';await api('/api/models/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('loaded').textContent=name;$('state').textContent='Ready';refresh()}catch(e){$('state').textContent=e.message}}async function unloadModel(){try{await api('/api/models/unload',{method:'POST'});$('loaded').textContent='No model loaded';$('state').textContent='Ready';refresh()}catch(e){$('state').textContent=e.message}}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('state').textContent='Uploading '+f.name+'…';try{await fetch('/api/models/upload',{method:'POST',headers:{'X-Filename':f.name,'Content-Type':'application/octet-stream'},body:f});$('state').textContent='Uploaded';refresh()}catch(x){$('state').textContent=x.message}e.target.value=''};$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('stop').onclick=async()=>{try{await api('/api/stop',{method:'POST'})}catch(e){}};async function send(){if(busy)return;let text=$('input').value.trim();if(!text)return;busy=true;$('send').disabled=true;$('stop').hidden=false;$('empty')?.remove();$('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text)}</div><div class="msg assistant" id="pending"><span class="dot"></span>Generating…</div>`);$('input').value='';$('chat').scrollTop=$('chat').scrollHeight;let t=performance.now();try{let r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,max_tokens:128})});let p=$('pending');p.textContent=r.text||'(no output)';$('tps').textContent=(r.tokens_per_sec||0).toFixed(1);$('state').textContent=r.stopped?'Stopped':'Ready'}catch(e){$('pending').textContent='Error: '+e.message}finally{busy=false;$('send').disabled=false;$('stop').hidden=true;$('chat').scrollTop=$('chat').scrollHeight}}async function status(){try{let s=await api('/api/status');$('cpu').textContent=s.cpu_logical+' threads';$('ram').textContent=s.ram_percent+'%';if(!busy)$('tps').textContent=(s.tokens_per_sec||0).toFixed(1);if(s.generating)$('state').textContent='Generating…'}catch(e){}}refresh();setInterval(()=>{status();refresh()},1500);status();</script></body></html>
