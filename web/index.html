<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>LAICompute</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0c;color:#f5f5f5}body{overscroll-behavior:none}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;height:100dvh;display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:auto;background:#0b0b0c}.side{border-right:1px solid #1d1d20;padding:18px;display:flex;flex-direction:column;gap:16px;background:#101012}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}.brand-dot{width:9px;height:9px;border-radius:50%;background:#8cff66;box-shadow:0 0 12px #8cff66}.sub,.hint{font-size:12px;color:#777}.side-head{display:flex;justify-content:space-between;align-items:center}.upload{display:block;width:100%;border:1px solid #303034;background:#171719;color:#eee;border-radius:14px;padding:13px;text-align:center;font-weight:700;cursor:pointer}.upload:hover{background:#1d1d20}.upload input{display:none}.model-list{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:2px}.model{padding:13px;border:1px solid #252529;border-radius:14px;background:#141416}.model.active{border-color:#777}.model-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.model-size{font-size:11px;color:#777;margin-top:4px}.model-actions{display:flex;gap:7px;margin-top:10px}.model-actions button,.secondary{border:0;border-radius:10px;padding:7px 10px;background:#eee;color:#111;font-weight:700;font-size:12px}.model-actions .secondary{background:#28282b;color:#bbb}.main{min-width:0;display:grid;grid-template-rows:auto 1fr auto}.top{min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid #1d1d20}.loaded{font-weight:750}.stats{display:flex;gap:18px;color:#777;font-size:12px}.stats b{color:#eee}.chat{overflow:auto;padding:28px 22px 34px;width:100%;max-width:920px;margin:auto}.welcome{min-height:65vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.logo{width:62px;height:62px;border-radius:20px;background:#18181b;display:grid;place-items:center;font-size:32px;margin-bottom:18px}.welcome h1{font-size:26px;margin:0 0 8px}.welcome p{color:#777;margin:0 0 24px;font-size:14px}.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,720px)}.suggestions button{border:1px solid #29292d;background:#121214;color:#ddd;padding:13px;border-radius:14px;text-align:left}.suggestions button:hover{background:#1b1b1e}.msg{padding:13px 15px;border-radius:17px;margin:13px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px}.user{background:#eaeaea;color:#111;margin-left:18%;border-bottom-right-radius:6px}.assistant{background:#171719;border:1px solid #252529;margin-right:12%;border-bottom-left-radius:6px}.typing{opacity:.65}.composer{padding:13px 22px calc(13px + env(safe-area-inset-bottom));border-top:1px solid #1d1d20;background:#0b0b0c}.compose{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end}.compose textarea{resize:none;min-height:50px;max-height:160px;width:100%;background:#151517;color:#fff;border:1px solid #29292d;border-radius:17px;padding:13px 14px;outline:none;line-height:1.4}.compose textarea:focus{border-color:#555}.send,.stop{height:44px;border:0;border-radius:14px;padding:0 17px;font-weight:800}.send{background:#eee;color:#111}.send:disabled{opacity:.35}.stop{background:#2a181b;color:#ff9da6;border:1px solid #4a2429}.meta{max-width:920px;margin:7px auto 0;display:flex;justify-content:space-between;color:#666;font-size:11px;padding:0 4px}.panel-toggle{display:none}.progress{height:3px;background:#222;overflow:hidden;border-radius:99px;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#eee;transition:width .15s}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.panel-toggle{display:block;border:0;background:transparent;color:#aaa;font-size:22px}.top{padding:12px 14px}.stats{gap:8px;font-size:10px}.chat{padding:18px 14px 24px}.composer{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.compose{grid-template-columns:1fr auto}.stop{grid-column:2;grid-row:1}.send{grid-column:2;grid-row:1}.meta{padding:0 2px}.user,.assistant{margin-left:0;margin-right:0}.suggestions{grid-template-columns:1fr}.welcome h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div><div class="brand"><span class="brand-dot"></span>LAICompute</div><div class="sub" style="margin-top:5px">Local CPU inference</div></div>
  <label class="upload" for="file">＋ Upload GGUF<input id="file" type="file" accept=".gguf,application/octet-stream"></label>
  <div class="hint" id="uploadHint">Models are stored locally on the server.</div>
  <div class="side-head"><strong>Models</strong><span class="hint" id="modelCount">0</span></div>
  <div class="model-list" id="models"></div>
</aside>
<main class="main">
<header class="top">
  <div style="min-width:0"><button class="panel-toggle" id="modelsBtn" aria-label="Models">☰</button><span class="loaded" id="loaded">No model loaded</span><div class="sub" id="state">Ready</div></div>
  <div class="stats"><span>CPU <b id="cpu">—</b></span><span>RAM <b id="ram">—</b></span><span>tok/s <b id="tps">—</b></span></div>
</header>
<section class="chat" id="chat">
  <div class="welcome" id="welcome"><div class="logo">π</div><h1>What can I help with?</h1><p>Run your GGUF models privately with LAICompute.</p><div class="suggestions"><button data-prompt="Explain how a Raspberry Pi works in simple terms.">Explain Raspberry Pi simply</button><button data-prompt="Give me three useful Linux commands.">Useful Linux commands</button><button data-prompt="Write a small C++ program that prints Hello World.">Write C++ code</button></div></div>
</section>
<footer class="composer"><form class="compose" id="composer"><textarea id="input" placeholder="Message LAICompute…" rows="1"></textarea><button id="stop" class="stop" type="button" hidden>Stop</button><button id="send" class="send" type="submit">↑</button></form><div class="meta"><span id="status">Connecting…</span><span id="modelMeta">No model loaded</span></div><div class="progress" id="progress" hidden><i></i></div></footer>
</main></div>
<script>
const $=id=>document.getElementById(id);let busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function size(n){let u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
async function api(path,opt={}){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function setState(x){$('state').textContent=x;$('status').textContent=x}
async function refresh(){try{const d=await api('/api/models');$('modelCount').textContent=d.length;const list=$('models');list.innerHTML=d.length?d.map(m=>`<div class="model ${m.loaded?'active':''}"><div class="model-name" title="${esc(m.name)}">${esc(m.name)}</div><div class="model-size">${size(m.size)} ${m.loaded?'· loaded':''}</div><div class="model-actions"><button onclick='loadModel(${JSON.stringify(m.name)})'>${m.loaded?'Use':'Load'}</button>${m.loaded?'<button class="secondary" onclick="unloadModel()">Unload</button>':''}</div></div>`).join(''):'<div class="hint">No GGUF models yet.</div>'}catch(e){setState('Offline')}}
async function loadModel(name){if(busy)return;try{setState('Loading '+name+'…');await api('/api/models/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('loaded').textContent=name;$('modelMeta').textContent=name;setState('Ready');await refresh()}catch(e){setState(e.message)}}
async function unloadModel(){if(busy)return;try{await api('/api/models/unload',{method:'POST'});$('loaded').textContent='No model loaded';$('modelMeta').textContent='No model loaded';setState('Ready');refresh()}catch(e){setState(e.message)}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.gguf')){setState('GGUF file required');e.target.value='';return}const xhr=new XMLHttpRequest();$('uploadHint').textContent=`Uploading ${f.name}…`;$('state').textContent='Uploading…';$('status').textContent=`Uploading ${f.name}…`;$('progress').hidden=false;$('progress').querySelector('i').style.width='0%';xhr.open('POST','/api/models/upload');xhr.setRequestHeader('X-Filename',f.name);xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total*100;$('progress').querySelector('i').style.width=p.toFixed(1)+'%';$('status').textContent=`Uploading ${f.name} · ${p.toFixed(0)}%`}};xhr.onload=async()=>{let d={};try{d=JSON.parse(xhr.responseText)}catch(_){}if(xhr.status>=200&&xhr.status<300){setState('Uploaded');$('uploadHint').textContent=`${f.name} uploaded`;await refresh()}else{setState(d.error||`Upload failed (HTTP ${xhr.status})`)}$('progress').hidden=true};xhr.onerror=()=>{setState('Upload failed — connection lost');$('progress').hidden=true};xhr.onloadend=()=>{e.target.value=''};xhr.send(f)};
$('composer').onsubmit=e=>{e.preventDefault();send()};$('input').oninput=()=>{$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,160)+'px'};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('stop').onclick=async()=>{try{await api('/api/stop',{method:'POST'});setState('Stopping…')}catch(e){setState(e.message)}};
async function send(){if(busy)return;const text=$('input').value.trim();if(!text)return;const models=await api('/api/models').catch(()=>({}));const active=(models||[]).find?.(m=>m.loaded);if(!active){$('side').style.display='flex';setState('Load a model first');return}busy=true;$('send').disabled=true;$('stop').hidden=false;$('welcome')?.remove();$('chat').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text)}</div><div class="msg assistant typing" id="pending">Generating…</div>`);const pending=$('pending');$('input').value='';$('input').style.height='auto';$('chat').scrollTop=$('chat').scrollHeight;setState('Generating…');try{
  const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify({message:text,max_tokens:128})});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||`HTTP ${r.status}`)}
  pending.classList.remove('typing');pending.textContent='';
  const reader=r.body.getReader();const decoder=new TextDecoder();let buffer='';let doneInfo=null;
  while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const parts=buffer.split('\n\n');buffer=parts.pop()||'';for(const part of parts){for(const line of part.split('\n')){if(!line.startsWith('data: '))continue;let d;try{d=JSON.parse(line.slice(6))}catch(_){continue}if(d.error)throw Error(d.error);if(d.token!==undefined){pending.textContent+=d.token;$('tps').textContent=(d.tokens_per_sec||0).toFixed(1);$('chat').scrollTop=$('chat').scrollHeight}if(d.done)doneInfo=d}}}
  $('tps').textContent=(doneInfo?.tokens_per_sec||0).toFixed(1);setState(doneInfo?.stopped?'Stopped':'Ready');
}catch(e){pending.classList.remove('typing');pending.textContent=pending.textContent||('Error: '+e.message);setState('Error')}finally{busy=false;$('send').disabled=false;$('stop').hidden=true;$('chat').scrollTop=$('chat').scrollHeight}}
async function status(){try{const s=await api('/api/status');$('cpu').textContent=(s.cpu_percent||0).toFixed(0)+'% · '+s.inference_threads+' threads';$('ram').textContent=s.ram_percent+'%';if(!busy)$('tps').textContent=(s.tokens_per_sec||0).toFixed(1);if(s.loaded){$('loaded').textContent=s.loaded;$('modelMeta').textContent=s.loaded}else{$('loaded').textContent='No model loaded';$('modelMeta').textContent='No model loaded'}if(s.generating){setState('Generating…');$('stop').hidden=false}}catch(e){}}
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.prompt;$('input').focus();$('input').dispatchEvent(new Event('input'))});
$('modelsBtn').onclick=()=>{$('side').style.display='flex';refresh()};
refresh();status();setInterval(()=>{status();refresh()},1500);
</script>
</body></html>
