<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAICompute</title><style>body{margin:0;background:#09090b;color:#eee;font:14px system-ui;display:flex;height:100vh}aside{width:260px;border-right:1px solid #29292f;padding:18px;box-sizing:border-box}main{flex:1;display:flex;flex-direction:column}.top{padding:16px;border-bottom:1px solid #29292f;display:flex;justify-content:space-between}.chat{flex:1;overflow:auto;padding:24px}.composer{padding:14px;border-top:1px solid #29292f;display:flex;gap:8px}.input{flex:1;background:#18181c;color:#eee;border:1px solid #29292f;border-radius:12px;padding:12px}.btn,select,input{background:#eee;color:#111;border:0;border-radius:10px;padding:9px 11px}.btn{font-weight:700;cursor:pointer}.ghost{background:#202024;color:#ddd}.model{padding:10px;border:1px solid #29292f;border-radius:10px;margin:8px 0}.row{display:flex;gap:8px;align-items:center}.muted{color:#888;font-size:12px}.setting{padding:12px 0;border-top:1px solid #29292f;margin-top:12px}.msg{margin:12px auto;max-width:820px}.bubble{padding:12px 15px;border-radius:15px;white-space:pre-wrap}.user{text-align:right}.user .bubble{display:inline-block;background:#eee;color:#111}.assistant .bubble{background:#151519;border:1px solid #29292f}@media(max-width:700px){aside{display:none}.top{padding:12px}.metric.cpu{display:none}}</style></head><body><aside><h2>LAICompute</h2><label class="btn" style="display:block;text-align:center">＋ Upload GGUF<input id="file" type="file" accept=".gguf" hidden></label><h4>Models <span id="count">0</span></h4><div id="models"></div><div class="setting"><b>Execution backend</b><select id="backend" style="width:100%;margin-top:8px"><option>AUTO</option><option>CPU</option><option>GPU</option><option>BOTH</option></select><div id="gpu" class="muted" style="margin-top:8px">Checking VideoCore…</div></div><div class="setting"><b>Generation</b><div class="row" style="margin-top:8px"><label>Max <input id="max" type="number" min="1" max="2048" value="128" style="width:65px"></label><label>Temp <input id="temp" type="number" min="0" max="2" step=".1" value="0" style="width:55px"></label></div></div></aside><main><header class="top"><div><b id="loaded">No model loaded</b><div id="state" class="muted">Ready</div></div><div class="row"><span class="metric" id="mode">AUTO</span><span class="metric" id="tps">— tok/s</span><span class="metric cpu" id="cpu">—% CPU</span></div></header><section class="chat" id="chat"><div id="welcome" style="text-align:center;margin-top:15vh"><h1>Run AI locally.</h1><p class="muted">CPU inference with optional VideoCore IV QPU acceleration.</p></div></section><form class="composer" id="form"><textarea id="input" class="input" rows="2" placeholder="Message your local AI…"></textarea><button class="btn danger" id="stop" type="button" hidden>■</button><button class="btn" type="submit">↑</button></form></main><script>const $=x=>document.getElementById(x);let busy=false;async function api(p,o={}){let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function safe(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(who,text){let d=document.createElement('div');d.className='msg '+who;d.innerHTML='<div class="bubble">'+safe(text)+'</div>';$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d.querySelector('.bubble')}async function refresh(){try{let a=await api('/api/models');$('count').textContent=a.length;$('models').innerHTML=a.map(m=>'<div class="model"><b>'+safe(m.name)+'</b><div class="muted">'+Math.round(m.size/1048576)+' MB'+(m.loaded?' · active':'')+'</div><button class="btn ghost" style="margin-top:7px" onclick="loadModel('+JSON.stringify(m.name)+')">Load</button></div>').join('')}catch(e){}}async function loadModel(n){try{$('state').textContent='Loading…';await api('/api/models/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});$('loaded').textContent=n;$('state').textContent='Ready';refresh()}catch(e){$('state').textContent=e.message}}async function status(){try{let s=await api('/api/status');$('mode').textContent=s.backend;$('tps').textContent=Number(s.tokens_per_sec).toFixed(2)+' tok/s';$('cpu').textContent=Number(s.cpu_percent).toFixed(0)+'% CPU';$('gpu').textContent=s.gpu_available?'QPU: '+s.gpu_device:'QPU unavailable';if(s.loaded)$('loaded').textContent=s.loaded;if(s.generating)$('state').textContent='Generating…'}catch(e){}}$('backend').onchange=async()=>{try{await api('/api/backend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('backend').value})});status()}catch(e){alert(e.message)}};$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;let text=$('input').value.trim();if(!text)return;add('user',text);$('welcome').style.display='none';$('input').value='';busy=true;$('stop').hidden=false;$('state').textContent='Generating…';let bubble=add('assistant','');try{let r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,max_tokens:Number($('max').value),temperature:Number($('temp').value)})});if(!r.ok)throw Error('Generation request failed');let reader=r.body.getReader(),dec=new TextDecoder(),buf='';for(;;){let z=await reader.read();if(z.done)break;buf+=dec.decode(z.value,{stream:true});let parts=buf.split('\n\n');buf=parts.pop();for(let p of parts){if(!p.startsWith('data: '))continue;let d=JSON.parse(p.slice(6));if(d.token)bubble.textContent+=d.token;if(d.tokens_per_sec)$('tps').textContent=Number(d.tokens_per_sec).toFixed(2)+' tok/s'}}}catch(e){bubble.textContent='Error: '+e.message}finally{busy=false;$('stop').hidden=true;$('state').textContent='Ready';status()}};$('stop').onclick=()=>api('/api/stop',{method:'POST'});$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let x=new XMLHttpRequest();x.open('POST','/api/models/upload');x.setRequestHeader('X-Filename',f.name);x.onload=()=>{if(x.status<300)refresh();else alert('Upload failed')};x.send(f)};refresh();status();setInterval(status,1000);</script></body></html>
