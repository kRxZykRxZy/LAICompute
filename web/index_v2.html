<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><title>LAICompute</title>
<style>
:root{--bg:#09090b;--panel:#111114;--panel2:#18181c;--line:#29292f;--text:#f4f4f5;--muted:#8b8b95;--accent:#fff;--danger:#ff5964;--r:18px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,input,textarea{font:inherit}button{border:0;color:inherit;cursor:pointer}.shell{height:100dvh;display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1500px;margin:auto;background:var(--bg)}.drawer{background:rgba(17,17,20,.96);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:18px;padding:4px}.mark{width:32px;height:32px;border-radius:11px;background:#eee;color:#111;display:grid;place-items:center;font-weight:950}.brand small{display:block;color:var(--muted);font-weight:500;font-size:10px;margin-top:1px}.upload{height:46px;border:1px solid #36363d;background:var(--panel2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:750}.upload:hover{background:#202025}.upload input{display:none}.section-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.models{overflow:auto;display:flex;flex-direction:column;gap:8px}.model{padding:12px;border:1px solid var(--line);background:#151519;border-radius:15px}.model.active{border-color:#666}.model-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.model-size{font-size:11px;color:var(--muted);margin-top:4px}.model-actions{display:flex;gap:7px;margin-top:10px}.model-actions button{padding:7px 10px;border-radius:10px;background:#eee;color:#111;font-size:11px;font-weight:800}.model-actions .ghost{background:#25252a;color:#bbb}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:11px;line-height:1.6}.main{min-width:0;display:grid;grid-template-rows:64px 1fr auto;position:relative}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(9,9,11,.92);backdrop-filter:blur(16px);z-index:10}.title-row{display:flex;align-items:center;gap:10px;min-width:0}.hamb{display:none;width:38px;height:38px;border-radius:12px;background:var(--panel2);font-size:19px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-size:11px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:8px}.metrics{display:flex;gap:8px}.metric{min-width:74px;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center}.metric b{display:block;font-size:12px}.metric span{display:block;color:var(--muted);font-size:9px;margin-top:1px}.settings-btn{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:17px}.chat{overflow:auto;scroll-behavior:smooth;padding:28px 18px 34px}.stream{width:min(850px,100%);margin:auto}.welcome{min-height:68vh;display:grid;place-items:center}.welcome-inner{text-align:center;width:min(700px,100%)}.hero-mark{width:68px;height:68px;border-radius:22px;background:#eee;color:#111;display:grid;place-items:center;font-size:30px;font-weight:950;margin:0 auto 18px}.welcome h1{font-size:30px;margin:0 0 8px;letter-spacing:-.03em}.welcome p{color:var(--muted);font-size:14px;margin:0 auto 26px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cards button{padding:15px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px}.cards button:hover{background:var(--panel2);border-color:#444}.cards strong{display:block;font-size:13px}.cards span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.msg{display:flex;margin:12px 0}.bubble{max-width:82%;padding:13px 15px;border-radius:18px;line-height:1.55;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{justify-content:flex-end}.user .bubble{background:#eee;color:#111;border-bottom-right-radius:6px}.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}.pending{opacity:.7}.cursor{display:inline-block;width:6px;height:15px;background:#aaa;margin-left:3px;vertical-align:-2px;animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}.composer{border-top:1px solid var(--line);padding:11px 18px calc(11px + env(safe-area-inset-bottom));background:rgba(9,9,11,.96);backdrop-filter:blur(18px)}.compose{width:min(850px,100%);margin:auto;display:flex;gap:8px;align-items:flex-end}.input-wrap{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px 9px 7px 14px;display:flex;align-items:flex-end}.input-wrap:focus-within{border-color:#555}.input{width:100%;resize:none;max-height:170px;min-height:34px;background:transparent;border:0;outline:0;color:var(--text);line-height:1.45;padding:5px 0}.input::placeholder{color:#666}.send{width:42px;height:42px;border-radius:14px;background:#eee;color:#111;font-size:18px;font-weight:900}.stop{width:42px;height:42px;border-radius:14px;background:#28171a;color:#ff9da4;border:1px solid #4d292e;font-size:16px}.send:disabled{opacity:.3}.composer-meta{width:min(850px,100%);margin:7px auto 0;display:flex;justify-content:space-between;color:#666;font-size:10px;padding:0 4px}.progress{height:3px;width:min(850px,100%);margin:7px auto 0;background:#202024;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#eee;transition:width .1s}.overlay{display:none}.settings{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:flex-end;justify-content:center}.settings.show{display:flex}.sheet{width:min(560px,100%);background:#141417;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{width:34px;height:34px;border-radius:11px;background:#242428;font-size:20px;line-height:1}.setting{padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.setting input{width:150px}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#eee;color:#111;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:780px){body{background:#09090b}.shell{display:block}.drawer{position:fixed;inset:0 auto 0 0;width:min(310px,88vw);transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 60px #000}.drawer.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}.overlay.show{display:block}.hamb{display:block}.top{height:58px;padding:9px 12px}.metrics .metric:nth-child(2),.metrics .metric:nth-child(3){display:none}.metric{min-width:66px;padding:6px 8px}.chat{padding:16px 12px 24px}.welcome{min-height:66vh}.welcome h1{font-size:25px}.cards{grid-template-columns:1fr}.bubble{max-width:91%;font-size:14px}.composer{padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.composer-meta{font-size:9px}.input-wrap{border-radius:17px}.title{max-width:145px}.top-actions{gap:5px}.settings-btn{width:36px;height:36px}}
</style></head>
<body>
<div class="shell"><aside class="drawer" id="drawer"><div class="brand"><div class="mark">L</div><div>LAICompute<small>Local AI inference</small></div></div><label class="upload">＋ Upload GGUF<input id="file" type="file" accept=".gguf,application/octet-stream"></label><div class="section-title"><span>Models</span><span id="count">0</span></div><div class="models" id="models"></div><div class="side-bottom">Private local inference<br><span id="engineInfo">Detecting CPU…</span></div></aside><div class="overlay" id="overlay"></div>
<main class="main"><header class="top"><div class="title-row"><button class="hamb" id="menu" type="button">☰</button><div><div class="title" id="loaded">No model loaded</div><div class="state" id="state">Ready</div></div></div><div class="top-actions"><div class="metrics"><div class="metric"><b id="tps">—</b><span>TOK/S</span></div><div class="metric"><b id="cpu">—</b><span>CPU</span></div><div class="metric"><b id="ram">—</b><span>RAM</span></div></div><button class="settings-btn" id="settingsOpen" type="button" aria-label="Generation settings">⚙</button></div></header>
<section class="chat" id="chat"><div class="stream" id="stream"><div class="welcome" id="welcome"><div class="welcome-inner"><div class="hero-mark">L</div><h1>Run AI locally.</h1><p>Fast, private GGUF inference powered by your CPU.</p><div class="cards"><button data-prompt="Explain how a Raspberry Pi works in simple terms."><strong>Explain something</strong><span>Get a clear, simple explanation</span></button><button data-prompt="Write a small C++ program that prints Hello World."><strong>Write code</strong><span>Generate a useful C++ example</span></button><button data-prompt="Give me five useful Linux commands and explain each one."><strong>Help with Linux</strong><span>Commands, debugging and tips</span></button><button data-prompt="Give me three creative project ideas I can build this weekend."><strong>Brainstorm</strong><span>Turn an idea into a build</span></button></div></div></div></div></section>
<footer class="composer"><form class="compose" id="form"><div class="input-wrap"><textarea class="input" id="input" rows="1" placeholder="Message your local AI…"></textarea></div><button class="stop" id="stop" type="button" hidden>■</button><button class="send" id="send" type="submit">↑</button></form><div class="composer-meta"><span id="status">Connecting…</span><span id="meta">No model</span></div><div class="progress" id="progress" hidden><i></i></div></footer></main></div>
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-hidden="true"><div class="sheet"><div class="sheet-head"><strong>Generation</strong><button class="close" id="close" type="button" aria-label="Close generation settings">×</button></div><div class="setting"><label>Max tokens <input id="maxTokens" type="range" min="16" max="512" step="16" value="128"><span id="maxValue">128</span></label></div><div class="setting"><label>Temperature <input id="temperature" type="range" min="0" max="150" step="10" value="0"><span id="tempValue">0.0</span></label></div></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let busy=false,drawerOpen=false,settingsOpen=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{let u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
async function api(p,o={}){let r=await fetch(p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function state(x){$('state').textContent=x;$('status').textContent=x}
function drawer(v){drawerOpen=v;$('drawer').classList.toggle('open',v);$('overlay').classList.toggle('show',v)}
function setSettings(v){settingsOpen=v;$('settings').classList.toggle('show',v);$('settings').setAttribute('aria-hidden',String(!v));document.body.style.overflow=v?'hidden':''}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
async function refresh(){try{let a=await api('/api/models');$('count').textContent=a.length;$('models').innerHTML=a.length?a.map(m=>`<div class="model ${m.loaded?'active':''}"><div class="model-name" title="${esc(m.name)}">${esc(m.name)}</div><div class="model-size">${fmt(m.size)} ${m.loaded?'· active':''}</div><div class="model-actions"><button onclick='loadModel(${JSON.stringify(m.name)})'>${m.loaded?'Active':'Load'}</button>${m.loaded?'<button class="ghost" onclick="unloadModel()">Unload</button>':''}</div></div>`).join(''):'<div style="color:#666;font-size:12px;padding:8px">Upload a .gguf model to begin.</div>'}catch(e){state('Offline')}}
async function loadModel(name){if(busy)return;try{state('Loading model…');await api('/api/models/load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('loaded').textContent=name;$('meta').textContent=name;state('Ready');drawer(false);toast('Model loaded');refresh()}catch(e){state(e.message);toast(e.message)}}
async function unloadModel(){if(busy)return;try{await api('/api/models/unload',{method:'POST'});$('loaded').textContent='No model loaded';$('meta').textContent='No model';state('Ready');refresh()}catch(e){toast(e.message)}}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.gguf')){toast('Please select a GGUF model');return}let x=new XMLHttpRequest();$('progress').hidden=false;$('progress i').style.width='0%';state('Uploading…');x.open('POST','/api/models/upload');x.setRequestHeader('X-Filename',f.name);x.setRequestHeader('Content-Type','application/octet-stream');x.upload.onprogress=e=>{if(e.lengthComputable){let p=e.loaded/e.total*100;$('progress i').style.width=p+'%';$('status').textContent='Uploading · '+p.toFixed(0)+'%'}};x.onload=async()=>{let d={};try{d=JSON.parse(x.responseText)}catch(_){}$('progress').hidden=true;if(x.status>=200&&x.status<300){toast('Model uploaded');state('Ready');refresh()}else toast(d.error||'Upload failed');e.target.value=''};x.onerror=()=>{toast('Upload failed');$('progress').hidden=true};x.send(f)};
function addMessage(text,who,id){let el=document.createElement('div');el.className='msg '+who;el.innerHTML='<div class="bubble"'+(id?' id="'+id+'"':'')+'>'+esc(text)+'</div>';$('stream').appendChild(el);return id?$(id):el.querySelector('.bubble')}
$('form').onsubmit=e=>{e.preventDefault();send()};$('input').oninput=()=>{$('input').style.height='auto';$('input').style.height=Math.min($('input').scrollHeight,170)+'px'};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('stop').onclick=async()=>{if(!busy)return;state('Stopping…');$('stop').disabled=true;try{await api('/api/stop',{method:'POST'})}catch(e){toast(e.message)}};
async function send(){if(busy)return;let text=$('input').value.trim();if(!text)return;let ms=await api('/api/models').catch(()=>[]),active=Array.isArray(ms)&&ms.find(m=>m.loaded);if(!active){drawer(true);toast('Load a model first');return}busy=true;$('send').disabled=true;$('stop').hidden=false;$('stop').disabled=false;$('welcome')?.remove();addMessage(text,'user');let bubble=addMessage('','assistant','answer');bubble.classList.add('pending');bubble.innerHTML='<span class="cursor"></span>';$('input').value='';$('input').style.height='auto';state('Generating…');$('chat').scrollTop=$('chat').scrollHeight;let done=null;try{let r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify({message:text,max_tokens:Number($('maxTokens').value),temperature_milli:Number($('temperature').value)*10})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Generation failed')}let reader=r.body.getReader(),dec=new TextDecoder(),buf='';while(true){let z=await reader.read();if(z.done)break;buf+=dec.decode(z.value,{stream:true});let parts=buf.split('\n\n');buf=parts.pop()||'';for(let p of parts){let line=p.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;let d;try{d=JSON.parse(line.slice(6))}catch(_){continue}if(d.error)throw Error(d.error);if(d.token!==undefined){bubble.textContent+=d.token;$('tps').textContent=(d.tokens_per_sec||0).toFixed(2);$('chat').scrollTop=$('chat').scrollHeight}if(d.done)done=d}}state(done?.stopped?'Stopped':'Ready');$('tps').textContent=(done?.tokens_per_sec||0).toFixed(2);if(done?.stopped)toast('Generation stopped')}catch(e){bubble.classList.remove('pending');if(!bubble.textContent)bubble.textContent='Error: '+e.message;state('Error');toast(e.message)}finally{bubble.classList.remove('pending');busy=false;$('send').disabled=false;$('stop').hidden=true;$('stop').disabled=false;$('chat').scrollTop=$('chat').scrollHeight}}
async function status(){try{let s=await api('/api/status');$('cpu').textContent=(s.cpu_percent||0).toFixed(0)+'%';$('ram').textContent=(s.ram_percent||0)+'%';if(!busy)$('tps').textContent=(s.tokens_per_sec||0).toFixed(2);if(s.loaded){$('loaded').textContent=s.loaded;$('meta').textContent=s.loaded}else{$('loaded').textContent='No model loaded';$('meta').textContent='No model'}if(s.cpu_logical)$('engineInfo').textContent=`${s.cpu_physical} cores · ${s.cpu_logical} threads · ${s.inference_threads} inference workers`;if(s.generating&&!busy){$('stop').hidden=false;state('Generating…')}}catch(_) {}}
$('menu').onclick=()=>drawer(true);$('overlay').onclick=()=>drawer(false);$('settingsOpen').onclick=()=>setSettings(true);$('close').onclick=()=>setSettings(false);$('settings').addEventListener('click',e=>{if(e.target===$('settings'))setSettings(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&settingsOpen)setSettings(false)});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.prompt;$('input').dispatchEvent(new Event('input'));$('input').focus()});
$('maxTokens').oninput=()=>$('maxValue').textContent=$('maxTokens').value;$('temperature').oninput=()=>$('tempValue').textContent=(Number($('temperature').value)/100).toFixed(1);
refresh();status();setInterval(status,1000);setInterval(refresh,3000);
</script></body></html>
